spring.application.name=DocflowTU_V2
# ตั้งค่าพอร์ตเซิร์ฟเวอร์
server.port=8080

# เชื่อมต่อฐานข้อมูล MySQL
# เปลี่ยน URL ไปชี้ที่ Endpoint ของ RDS
spring.datasource.url=jdbc:mysql://docflow-db.c4pie0kyaq43.us-east-1.rds.amazonaws.com:3306/cs361_emailbox?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true
# ใส่ Username และ Password ที่คุณตั้งไว้ตอนสร้าง RDS
spring.datasource.username=admin
spring.datasource.password=Chaloemwong109

# ตั้งค่า JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS S3 Configuration
aws.s3.bucket-name=cs261-edocflow-storage-tu 
aws.region=us-east-1

# นำค่าจาก AWS Academy มาใส่ให้ตรงช่อง (ระวังอย่าให้มีช่องว่างต่อท้าย)
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.session-token=${AWS_SESSION_TOKEN}
# ขยายขนาดไฟล์สูงสุดที่อนุญาตให้อัปโหลด
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB